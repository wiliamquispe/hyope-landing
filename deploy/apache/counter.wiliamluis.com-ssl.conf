<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName counter.wiliamluis.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/counter.wiliamluis.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/counter.wiliamluis.com/privkey.pem

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/
    RequestHeader set X-Forwarded-Proto "https"

    ErrorLog ${APACHE_LOG_DIR}/counter_error.log
    CustomLog ${APACHE_LOG_DIR}/counter_access.log combined
</VirtualHost>
</IfModule>
