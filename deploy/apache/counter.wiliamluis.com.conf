<VirtualHost *:80>
    ServerName counter.wiliamluis.com

    # Let certbot answer its challenge; never proxy this path
    ProxyPass /.well-known/acme-challenge/ !

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8081/
    ProxyPassReverse / http://127.0.0.1:8081/

    ErrorLog ${APACHE_LOG_DIR}/counter_error.log
    CustomLog ${APACHE_LOG_DIR}/counter_access.log combined
</VirtualHost>
